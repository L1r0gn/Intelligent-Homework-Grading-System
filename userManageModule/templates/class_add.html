{% extends 'page_base.html' %}
{% load static %}

{% block title %}添加班级{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="page-header">
                <div>
                    <h2>添加班级</h2>
                    <p class="page-sub">创建班级后，可将学生与任课教师加入其中。</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="name" class="form-label">班级名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="请输入班级名称" required>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="reset" class="btn btn-outline-secondary">重置</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check me-1"></i>提交
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
