name: URL Convention CI

# 只校验路由规范与引用完整性：
#   1. manage.py check —— URLConf 能被完整加载（能抓到 import 错误、命名空间错误）
#   2. tests/test_url_convention.py —— 6 条路由规范断言
#   3. 路由清单导出到 Job Summary，方便 PR 评审时直接看改了哪些路径
#
# 说明：本仓库的 requirements.txt 历史上是 UTF-16 编码且末行被拼接，
# 因此这里不依赖它，改为显式安装本检查所需的最小依赖集。
#
# 运维提醒：本 workflow 配置了 paths 过滤。若在分支保护里把它设为 required check，
# 未命中这些路径的 PR 不会触发该检查，会一直显示 "Expected — waiting"。
# 需要必过时，请去掉 paths 过滤，或改用独立的 "始终运行" 汇总 job。

on:
  push:
    branches: [main]
    paths:
      - '**/urls.py'
      - '**/api_urls.py'
      - 'api/**'
      - '**/views.py'
      - '**/templates/**'
      - 'tests/**'
      - '.github/workflows/url-ci.yml'
  pull_request:
    paths:
      - '**/urls.py'
      - '**/api_urls.py'
      - 'api/**'
      - '**/views.py'
      - '**/templates/**'
      - 'tests/**'
      - '.github/workflows/url-ci.yml'
  workflow_dispatch:

concurrency:
  group: url-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  url-convention:
    name: 路由规范校验
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 越权测试等属于 TestCase，需要真实数据库建测试库
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: ihgs
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查硬编码密钥
        run: |
          # 放在最前面：不装依赖就能判定，失败得快。
          # 历史背景：__init__.py 的部署注释里曾提交过 GitHub PAT，触发 secret scanning 告警。
          PATTERN='ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9]{20,}|AKID[A-Za-z0-9]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nE "$PATTERN" -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::发现疑似硬编码密钥，请改为从 config.py 或环境变量读取"
            exit 1
          fi
          echo "未发现硬编码密钥"

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/url-ci.yml'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 业务依赖（与 requirements.txt 对齐，仅取 Django 启动所需）
          pip install \
            "Django==4.2.21" \
            "djangorestframework==3.15.2" \
            "djangorestframework-simplejwt==5.3.1" \
            "PyMySQL==1.1.1" \
            "celery==5.5.3" \
            "openai==2.0.0" \
            "requests==2.32.4" \
            "Pillow==10.4.0" \
            "numpy==2.2.6" \
            "redis==6.1.1" \
            "django-jsonfield-backport==1.0.5" \
            "cryptography==43.0.3"
          # torch 用 CPU 版，避免拉 NVIDIA CUDA 依赖（体积差一个数量级）
          pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu

      - name: 生成 CI 用 config.py
        run: |
          # config.py 被 .gitignore 排除，这里写入与上面 MySQL service 一致的密码
          cat > config.py <<'PY'
          DATABASES_PASSWORD = 'ci-root'
          OPENROUTER_API_KEY = 'ci-placeholder'
          WECHAT_APPID = 'ci-placeholder'
          WECHAT_SECRET = 'ci-placeholder'
          DOMAIN_ID = '127.0.0.1'
          DOMAIN_NAME = 'localhost'
          PY

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if python -c "import pymysql,os; pymysql.connect(host='127.0.0.1', user='root', password='ci-root')" 2>/dev/null; then
              echo "MySQL 已就绪"; exit 0
            fi
            sleep 2
          done
          echo "MySQL 连接超时"; exit 1

      - name: Django 自检
        run: python manage.py check

      - name: 路由规范 / 迁移健康度 / 越权测试
        run: python manage.py test tests -v 2 --noinput

      - name: 导出路由清单
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import django

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'IntelligentHomeworkGradingSystem.settings')
          django.setup()

          from django.urls import URLResolver, get_resolver

          rows = []

          def walk(patterns, namespace=None, prefix=''):
              for entry in patterns:
                  if isinstance(entry, URLResolver):
                      child = entry.namespace or namespace
                      walk(entry.url_patterns, child, prefix + str(entry.pattern))
                  else:
                      if namespace in ('admin',):
                          continue
                      full = f'{namespace}:{entry.name}' if namespace and entry.name else (entry.name or '-')
                      rows.append((prefix + str(entry.pattern), full))

          walk(get_resolver().url_patterns)

          print('## 路由清单\n')
          print(f'共 {len(rows)} 条业务路由（不含 Django Admin）\n')
          print('| 路径 | 路由名 |')
          print('| --- | --- |')
          for path, name in rows:
              print(f'| `{path or "/"}` | `{name}` |')
          PY
